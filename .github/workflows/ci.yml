name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Набор джоб дословно накрывает корневой `pnpm ci:check`
# (lint → typecheck → contracts:lint → contracts:typecheck → test:unit → build),
# просто разложенный по параллельным джобам ради времени прогона.
# У каждой джобы обязателен timeout-minutes: без него зависший шаг висит до дефолтных
# 6 часов и сжигает минуты runner-а — именно так CI и стал дорогим до отключения Actions.
jobs:
  tests_python:
    name: Python (pytest)
    runs-on: ubuntu-latest
    # Один smoke-файл: ставится pip-окружение и почти сразу отрабатывает.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python_tests/requirements.txt
      - name: Install pytest
        run: pip install -r python_tests/requirements.txt
      - name: Run pytest
        run: python3 -m pytest

  lint_typecheck:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    # Установка зависимостей + turbo lint/typecheck по 9 пакетам (typecheck ещё и собирает зависимости).
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      # Отдельные шаги контрактов есть и в ci:check: contracts:lint — свой линтер правил DTO
      # (turbo lint его не запускает), contracts:typecheck держит проверку даже если пакет
      # когда-нибудь выпадет из turbo-графа typecheck.
      - name: Contracts lint
        run: pnpm contracts:lint
      - name: Contracts typecheck
        run: pnpm contracts:typecheck

  tests_backend:
    name: Backend tests
    runs-on: ubuntu-latest
    needs: lint_typecheck
    # Самая тяжёлая джоба: ~352 файла тестов бэкенда, fileParallelism отключён конфигом.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Один прогон вместо пяти. Скрипты test:integration / test:migrations / test:security /
      # test:isolation — это фильтры по именам файлов внутри apps/backend/src, то есть строгие
      # подмножества test:backend; раньше те же 31 файл гонялись повторно, плюс каждый прогон
      # заново поднимал vitest. Ничего не потеряно: проверено сверкой списков файлов.
      - name: Backend tests (включая integration/migrations/security/isolation)
        run: pnpm test:backend

  tests_frontend_and_contracts:
    name: Frontend + contracts + packages tests
    runs-on: ubuntu-latest
    needs: lint_typecheck
    # ~182 файла: фронт, контракты и остальные пакеты; фронтовый набор идёт за считанные минуты.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Вместе с джобой tests_backend это ровно `pnpm test:unit` (turbo run test по всем пакетам).
      # Раньше здесь были только frontend и api-contracts, а тесты ui / worker / realtime /
      # shared-types / docx-render / test-utils в CI не запускались вовсе. Фильтр-исключение,
      # а не перечисление пакетов: новый пакет подхватится сам.
      - name: Tests for every package except backend
        run: pnpm exec turbo run test --filter='!@trudskill/backend'

  contract_drift_check:
    name: Contract drift check (required)
    runs-on: ubuntu-latest
    needs: lint_typecheck
    # Только регенерация контрактов и сравнение с закоммиченным — минуты.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify generated API contract artifacts are up-to-date
        run: pnpm --filter @trudskill/api-contracts contracts:check-generated

  # Джоба frontend_typecheck_build удалена как полный дубль: `pnpm typecheck` уже включает
  # @trudskill/frontend, а `pnpm build` — и @trudskill/ui, и @trudskill/frontend (next build).
  # Чтобы не потерять ранний сигнал о поломке сборки, build теперь ждёт только lint_typecheck
  # и идёт параллельно тестам, а дорогой docker-smoke — уже после зелёных тестов.

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint_typecheck
    # Долгая часть — next build --webpack у фронта.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Витрина валидирует NEXT_PUBLIC_* схемой Zod на пререндере, а .env.local в gitignore —
      # поэтому в CI сборка падала на первой же статической странице («/audit»), хотя локально
      # проходила у всех, у кого этот файл создан руками. Значения здесь — заглушки: сборка
      # проверяет, что страницы рендерятся, а не что адреса рабочие.
      - name: Build all packages/apps
        run: pnpm build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3001/api/v1
          NEXT_PUBLIC_REALTIME_URL: ws://localhost:3002
          PUBLIC_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_DEFAULT_TENANT_ID: tenant_demo

  backend_image_smoke:
    name: Backend image smoke test
    runs-on: ubuntu-latest
    needs:
      - build
      - tests_backend
      - tests_frontend_and_contracts
      - contract_drift_check
      - tests_python
    # Сборка образа с нуля (кеша слоёв на runner-е нет) + до 60 с ожидания health-эндпоинта.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: docker build -f apps/backend/Dockerfile -t cdoprof-backend-smoke:${{ github.sha }} .
      - name: Run backend image and check live endpoint
        run: |
          docker run -d --rm --name backend-smoke \
            -p 3001:3001 \
            -e NODE_ENV=production \
            -e RELEASE_VERSION=ci-smoke \
            -e BACKEND_PORT=3001 \
            -e API_PREFIX=/api/v1 \
            -e DATABASE_URL=http://localhost:5432 \
            -e REDIS_URL=redis://localhost:6379 \
            -e RABBITMQ_URL=amqp://localhost:5672 \
            -e S3_ENDPOINT=http://localhost:9000 \
            -e S3_ACCESS_KEY=smoke-access \
            -e S3_SECRET_KEY=smoke-secret \
            -e S3_BUCKET=smoke-bucket \
            -e AUTH_JWT_SECRET=production-safe-secret-123 \
            -e SESSION_SECRET=production-safe-session-123 \
            -e ACCESS_TOKEN_TTL_SECONDS=900 \
            -e REFRESH_TOKEN_TTL_SECONDS=604800 \
            -e DB_MIGRATIONS_ENABLED=false \
            -e DB_MIGRATIONS_DIR=migrations \
            -e CORS_ORIGIN=http://localhost:3000 \
            -e PUBLIC_BASE_URL=http://localhost:3000 \
            -e REALTIME_PUBLIC_URL=http://localhost:3002 \
            -e REALTIME_PUBLISH_KEY=ci-smoke-realtime-publish-key \
            -e ALLOW_IN_MEMORY_STATE=false \
            -e INTEGRATION_WEBHOOK_SECRET=ci-smoke-webhook-secret \
            -e DEPLOYMENT_PROFILE=prod \
            -e MVP_PERSISTENCE_DRIVER=postgres \
            -e DOCUMENTS_PERSISTENCE_DRIVER=postgres \
            -e SCORM_CONTENT_TOKEN_SECRET=ci-smoke-scorm-token-secret-1234567890 \
            -e ESIA_STATE_SECRET=ci-smoke-esia-state-secret-1234567890 \
            -e METRICS_TOKEN=ci-smoke-metrics-token-1234567890 \
            -e INTEGRATION_CRYPTO_KEYS=v1:Y2ktc21va2Uta2V5Y2ktc21va2Uta2V5Y2ktc21va2U= \
            -e INTEGRATION_CRYPTO_ACTIVE_KEY_VERSION=v1 \
            cdoprof-backend-smoke:${{ github.sha }}

          cleanup() {
            docker logs backend-smoke || true
            docker stop backend-smoke || true
          }
          trap cleanup EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/api/v1/health/live > /tmp/backend-smoke.json; then
              cat /tmp/backend-smoke.json
              exit 0
            fi
            sleep 2
          done

          echo "Backend image did not become healthy in time."
          exit 1
