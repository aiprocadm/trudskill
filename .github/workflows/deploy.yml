name: Deploy

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    # Деплой держит SSH-сессию, пока сервер собирает образы: без ограничения зависшая
    # сборка висела бы до дефолтных 6 часов и жгла минуты runner-а.
    timeout-minutes: 30
    steps:
      - name: Deploy over SSH (build on server)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # У самого действия свой предел на команду, по умолчанию 10 минут — он
          # наступил бы РАНЬШЕ 30-минутного потолка джобы и оборвал бы сборку образов
          # на сервере посреди работы. Держим их согласованными.
          command_timeout: 25m
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            # Дамп ПЕРЕД выкаткой (Фаза 6 Task 4): выкатка применяет миграции, и если
            # релиз окажется неудачным, откатывать придётся не только код, но и данные.
            # Копия снимается на СТАРОМ коде — том, который сейчас работает.
            # Неудачный дамп останавливает выкатку: катиться, не имея точки возврата,
            # опаснее, чем не выкатиться совсем.
            infra/backup.sh
            git fetch --all
            git reset --hard origin/main
            set -a; . infra/.env.production; set +a
            docker compose -f infra/docker-compose.prod.yml up -d --build
            docker compose -f infra/docker-compose.prod.yml ps
