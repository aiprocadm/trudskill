packages:
  - apps/*
  - packages/*

# pnpm 11 переспрашивает перед сносом node_modules, а без терминала просто отказывается
# работать (`ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY`). Первая установка после
# перехода с pnpm 9 как раз требует сноса — раскладка каталога другая. Наши установки
# идут из CI и из cron автообновления стенда, где терминала нет и подтвердить некому:
# без этой настройки обновление стенда упало бы и откатилось.
confirmModulesPurge: false

# pnpm 11 не запускает установочные скрипты зависимостей молча: неразрешённый скрипт
# теперь ОШИБКА установки (`ERR_PNPM_IGNORED_BUILDS`), а не предупреждение. Это защита
# от цепочек поставок — произвольный код из зависимости больше не выполняется по
# умолчанию. Поэтому по каждому пакету нужен явный ответ.
#
# Заготовка этого списка лежала в репозитории с плейсхолдерами «set this to true or
# false» и никем не была заполнена — под pnpm 9 она просто не работала.
allowBuilds:
  # Скачивает и линкует свой платформенный бинарник. Без него не собирается ничего:
  # на esbuild стоят и Next.js, и vitest.
  esbuild: true
  # Нативный резолвер путей для eslint-plugin-import-x — им проверяется порядок
  # импортов во всём монорепозитории.
  unrs-resolver: true
  # Установочный скрипт печатает просьбу о пожертвовании — на работу не влияет.
  '@nestjs/core': false
  # Приезжают транзитивно из testcontainers (docker-modem → ssh2) и нужны только
  # интеграционным тестам с докером. cpu-features — необязательное ускорение
  # шифрования, ssh2 без него работает на чистом JS.
  cpu-features: false
  ssh2: false
  # Постустановочный скрипт готовит облегчённые сборки, которыми мы не пользуемся.
  protobufjs: false
