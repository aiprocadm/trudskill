# Тестовый стенд trudskill на lms.ptsfera.online. См. docs/RUNBOOK_TEST_STAND.md.
# Ставится в /etc/nginx/sites-available/, включается симлинком в sites-enabled/.
#
# Один поддомен на проект: витрина в корне, сервер под /api, живые обновления
# под /realtime — всё на одном домене, поэтому CORS не нужен.
#
# Это состояние ДО выпуска сертификата. Certbot допишет блоки HTTPS (443) и
# редирект с 80 — после этого файл нельзя перезаписывать целиком, только точечно
# править (иначе дописанное certbot пропадёт и HTTPS отвалится).

server {
    listen 80;
    listen [::]:80;
    server_name lms.ptsfera.online;

    # Realm ТОЛЬКО ЛАТИНИЦЕЙ: по RFC 7230/7235 в значении заголовка допустим
    # лишь ASCII. С кириллицей Chrome и Яндекс.Браузер молча отказываются
    # показать окно пароля — сайт просто не открывается, хотя curl и внешние
    # проверялки исправно получают 401 и всё выглядит здоровым.
    auth_basic "Test stand";
    auth_basic_user_file /etc/nginx/.htpasswd-stand;

    client_max_body_size 100m;

    # Робот Let's Encrypt должен приходить без пароля, иначе сертификат
    # не выпустится и не продлится через 3 месяца.
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/html;
    }

    # --- Сервер API ---
    # auth_basic off здесь ОБЯЗАТЕЛЕН. Приложение кладёт токен в заголовок
    # Authorization, а браузер держит там же пропуск basic-auth — карман один,
    # и токен вытесняет пропуск. Симптом: первый вход через окно nginx проходит,
    # форма логина открывается, но после отправки логина окно nginx появляется
    # снова и войти невозможно. Сервер защищён своей авторизацией.
    location /api/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # --- Живые обновления ---
    # Пароль снят по той же причине: подключение несёт токен приложения.
    # Заголовки Upgrade/Connection обязательны, иначе соединение не поднимется.
    location /realtime/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:3012/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Поток событий не должен буферизоваться, иначе обновления приходят пачками.
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Витрина ---
    location / {
        proxy_pass http://127.0.0.1:3015;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
