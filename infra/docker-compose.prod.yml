name: cdoprof

# Ротация журналов контейнеров (Фаза 6 Task 3).
#
# По умолчанию docker пишет журнал каждого контейнера в json-файл БЕЗ предела: он растёт,
# пока не кончится диск. Диск здесь общий с базой, MinIO (видео курсов и прокторинга) и
# каталогом бэкапов, поэтому переполнение = Postgres встаёт в read-only И ночной бэкап
# не снимается одновременно. Полгигабайта на сервис (5 файлов по 100 МБ) хватает на
# разбор аварии и не съедает место.
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: '100m'
    max-file: '5'

services:
  postgres:
    logging: *default-logging
    image: postgres:18
    env_file: .env.production
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    logging: *default-logging
    image: redis:8
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    logging: *default-logging
    image: rabbitmq:4.3-management
    env_file: .env.production
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    logging: *default-logging
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    env_file: .env.production
    volumes:
      - minio-data:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    logging: *default-logging
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    env_file: .env.production
    restart: 'no'
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${S3_BUCKET}
      "

  # Антивирусный демон (ФТ-G5). В проде ВКЛЮЧЁН: backend ждёт его готовности,
  # ANTIVIRUS_ENABLED=true в .env.production. Первый старт долгий — freshclam качает базу
  # сигнатур (start_period 120s). База persists в томе clamav-data, чтобы не качать повторно.
  clamav:
    logging: *default-logging
    image: clamav/clamav:1.5.3
    env_file: .env.production
    volumes:
      - clamav-data:/var/lib/clamav
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # Gotenberg (ФТ-A1.3): DOCX→PDF (LibreOffice внутри). Внутренний порт 3000 (по имени сервиса).
  # Инфраструктура готова к Фазе 1; сам рендер (worker → Gotenberg) подключается там. GET /health.
  gotenberg:
    logging: *default-logging
    image: gotenberg/gotenberg:8
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  supertokens:
    logging: *default-logging
    image: registry.supertokens.io/supertokens/supertokens-postgresql:12.0
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3567/hello']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    logging: *default-logging
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      supertokens:
        condition: service_healthy
      clamav:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3001/api/v1/health/live']
      interval: 10s
      timeout: 5s
      retries: 5

  realtime:
    logging: *default-logging
    build:
      context: ..
      dockerfile: apps/realtime/Dockerfile
    env_file: .env.production
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    logging: *default-logging
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    env_file: .env.production
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
    restart: unless-stopped
    # Фаза 6 Task 5: воркер был ЕДИНСТВЕННЫМ сервисом без проверки живости — умерший
    # выглядел как работающий, очередь просто копилась. Ручка внутренняя, порт наружу
    # не публикуется.
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "require(\"http\").get({host:\"127.0.0.1\",port:process.env.WORKER_HEALTH_PORT||3030,path:\"/healthz\"},r=>process.exit(r.statusCode===200?0:1)).on(\"error\",()=>process.exit(1))"'
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    logging: *default-logging
    build:
      context: ..
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_REALTIME_URL: ${NEXT_PUBLIC_REALTIME_URL}
        NEXT_PUBLIC_DEFAULT_TENANT_ID: ${NEXT_PUBLIC_DEFAULT_TENANT_ID}
    env_file: .env.production
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    logging: *default-logging
    image: caddy:2
    depends_on:
      - frontend
      - backend
      - realtime
    env_file: .env.production
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
  clamav-data:
  caddy-data:
  caddy-config:
