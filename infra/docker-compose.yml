# Ротация журналов контейнеров (Фаза 6 Task 3).
#
# По умолчанию docker пишет журнал каждого контейнера в json-файл БЕЗ предела: он растёт,
# пока не кончится диск. Диск здесь общий с базой, MinIO (видео курсов и прокторинга) и
# каталогом бэкапов, поэтому переполнение = Postgres встаёт в read-only И ночной бэкап
# не снимается одновременно. Полгигабайта на сервис (5 файлов по 100 МБ) хватает на
# разбор аварии и не съедает место.
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: '100m'
    max-file: '5'

services:
  postgres:
    logging: *default-logging
    image: postgres:18
    environment:
      POSTGRES_DB: cdoprof
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d cdoprof']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    logging: *default-logging
    image: redis:8
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    logging: *default-logging
    image: rabbitmq:4.3-management
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    logging: *default-logging
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    logging: *default-logging
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio minio123 &&
      mc mb --ignore-existing local/cdoprof-dev
      "

  # Антивирусный демон (ФТ-G5). В dev по умолчанию ВЫКЛЮЧЕН на стороне backend
  # (ANTIVIRUS_ENABLED=false в .env.example → NoopAntivirusScanner), чтобы не грузить
  # локалку загрузкой базы сигнатур. Поднять при необходимости: `docker compose up -d clamav`
  # и выставить ANTIVIRUS_ENABLED=true. Первый старт долгий — freshclam качает базу.
  clamav:
    logging: *default-logging
    image: clamav/clamav:1.5.3
    ports:
      - '3310:3310'
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # Gotenberg (ФТ-A1.3): конвертация DOCX→PDF (LibreOffice внутри). Внутренний порт 3000 —
  # обращаемся по имени сервиса `gotenberg:3000` внутри сети compose; host-порт НЕ пробрасываем,
  # чтобы не конфликтовать с фронтендом на :3000. Здесь только инфраструктура — сам движок
  # рендера (worker → Gotenberg) подключается в Фазе 1 (ЭПИК A). Health-эндпоинт: GET /health.
  gotenberg:
    logging: *default-logging
    image: gotenberg/gotenberg:8
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
  clamav-data:
